<!--hte {"desc":"方案对比卡（航班、酒店、报价）：每个选项一张小卡片，显示名称、价格、几行要点，带「选这个」按钮；点了会作为一次选择传回对话。o 里每项：k 按钮键、n 名称、p 价格/主数字、d 要点列表、v 选中后回传给模型的说明、best 可标「推荐」（或自定义文字）、b 按钮文字。","actions_from":"o","example":{"t":"示例：两个方案","o":[{"k":"a","n":"方案 A","p":"$1,200","d":["要点 1","要点 2"],"v":"选方案 A","best":true},{"k":"b","n":"方案 B","p":"$1,350","d":["要点 1","要点 2"],"v":"选方案 B"}],"note":"数据来源和时间"}}-->
<style>body{margin:0}.w{padding:12px 12px 26px}.h{font-weight:600;margin:0 2px 8px}.g{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.c{border-radius:12px;padding:10px;background:var(--tg-theme-secondary-bg-color)}.c.b{box-shadow:inset 0 0 0 2px var(--tg-theme-button-color)}.n{font-weight:600;font-size:.92em}.p{font-size:1.45em;font-weight:700;margin:4px 0 2px;color:var(--tg-theme-accent-text-color)}.d{font-size:.78em;color:var(--tg-theme-hint-color);line-height:1.45}.c button{width:100%;margin-top:8px}.tg{display:inline-block;font-size:.68em;font-weight:500;padding:1px 6px;border-radius:8px;background:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color);margin-left:4px;vertical-align:1px}.x{font-size:.75em;color:var(--tg-theme-hint-color);margin:8px 2px 0}</style>
<div class="w" data-hte-actions><div class="h" id="h"></div><div class="g" id="g"></div><div class="x" id="x"></div></div>
<script>
const T=window.TelegramWidget,$=i=>document.getElementById(i),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let s=null;try{s=JSON.parse(T&&T.chatData||'null')}catch(e){}
if(s){$('h').textContent=s.t||'';$('x').textContent=s.note||'';
$('g').innerHTML=(s.o||[]).map(o=>'<div class="c'+(o.best?' b':'')+'"><div class="n">'+E(o.n)+(o.best?'<span class="tg">'+E(typeof o.best==='string'?o.best:'推荐')+'</span>':'')+'</div><div class="p">'+E(o.p)+'</div><div class="d">'+(o.d||[]).map(E).join('<br>')+'</div>'+(o.k?'<button data-action="'+E(o.k)+'">'+E(o.b||'选这个')+'</button>':'')+'</div>').join('')}
if(T&&T.ready)T.ready();
</script>
