<!--hte {"desc":"进度追踪卡（快递、行程、长任务）：一排步骤，当前步骤会闪动，可写预计时间和备注。i 是当前步骤序号（从 0 开始）。之后用 action=update 改 i/n/at，界面原地前进。","example":{"t":"示例：快递 · 1Z…","s":["已建单","已揽收","运输中","派送中","已签收"],"i":2,"eta":"预计周四送达","n":"当前位置等备注","at":"11/10 15:40"}}-->
<style>body{margin:0}.w{padding:14px 16px 28px}.t{font-weight:600}.e{color:var(--tg-theme-hint-color);font-size:.85em;margin-top:2px}.r{display:flex;margin:18px 0 4px;position:relative}.l{position:absolute;top:10px;height:3px;border-radius:2px}#b{background:var(--tg-theme-secondary-bg-color)}#f{background:var(--tg-theme-button-color);transition:width .8s}.s{flex:1;text-align:center;font-size:.72em;line-height:1.3;color:var(--tg-theme-hint-color);position:relative}.d{width:16px;height:16px;border-radius:50%;margin:2px auto 6px;background:var(--tg-theme-secondary-bg-color);border:3px solid var(--tg-theme-bg-color)}.s.on{color:var(--tg-theme-text-color)}.s.on .d{background:var(--tg-theme-button-color)}.s.cur .d{animation:p 1.4s ease-in-out infinite}@keyframes p{50%{transform:scale(1.3)}}.n{font-size:.88em;margin-top:10px}.u{font-size:.72em;color:var(--tg-theme-hint-color);margin-top:4px}</style>
<div class="w"><div class="t" id="t"></div><div class="e" id="e"></div><div class="r" id="r"></div><div class="n" id="n"></div><div class="u" id="u"></div></div>
<script>
const T=window.TelegramWidget,$=i=>document.getElementById(i),E=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function draw(){let s=null;try{s=JSON.parse(T&&T.chatData||'null')}catch(e){}if(!s)return;
const S=s.s||[],n=Math.max(S.length,1),i=Math.max(0,Math.min(n-1,s.i|0)),done=i>=n-1;
$('t').textContent=s.t||'';$('e').textContent=s.eta||'';$('n').textContent=s.n||'';$('u').textContent=s.at?('更新于 '+s.at):'';
const a=50/n,full=100*(n-1)/n;
$('r').innerHTML='<div class="l" id="b" style="left:'+a+'%;width:'+full+'%"></div><div class="l" id="f" style="left:'+a+'%;width:'+(100*i/n)+'%"></div>'+S.map((x,k)=>'<div class="s'+(k<=i?' on':'')+(k===i&&!done?' cur':'')+'"><div class="d"></div>'+E(x)+'</div>').join('')}
if(T)T.onEvent('chatDataChanged',draw);draw();if(T&&T.ready)T.ready();
</script>
