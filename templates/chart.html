<div id="chart"><!--hte-chart--></div>
<script>(function(){
const H=window.HTE,E=H.esc,F=v=>String(Math.round(v*10)/10),short=(s,w)=>{let n=0,o='';for(const c of s){n+=c.codePointAt(0)>255?2:1;if(n>w)return o+'…';o+=c}return o};

text(10,20,short(s.title||'',42),'title');text(308,37,short(s.unit||'',24),'','end');
for(let k=Math.ceil(lo/step-1e-9),end=Math.floor(hi/step+1e-9);k<=end;k++){const y=Y(k*step);path('grid','M58 '+F(y)+'H308');text(52,y+3,tick(k*step),'','end')}
if(bar)path('base','M58 '+F(Y(0))+'H308');if(s.highlight!=null)path('base','M'+F(X(s.highlight))+' 50V178',' stroke-dasharray="2 3"');
const labels=Math.min(n,5);for(let j=0;j<labels;j++){const i=Math.round(j*(n-1)/Math.max(labels-1,1));text(X(i),195,short(s.x[i],8),'',i===n-1?'end':'middle')}
S.forEach((r,k)=>{const vs=r.values;let d='',gap=true;vs.forEach((v,i)=>{if(v==null){gap=true;return}const x=X(i),y=Y(v);

else{d+=(gap?'M':'L')+F(x)+' '+F(y);gap=false;if((i===0||vs[i-1]==null)&&(i===n-1||vs[i+1]==null))out+='<circle class="f'+k+'" cx="'+F(x)+'" cy="'+F(y)+'" r="2.5"/>'}});
if(!bar)path('s'+k,d);const lx=12+k*100;path('s'+k,'M'+lx+' 213h16');text(lx+22,216,short(r.name,12),'legend')});
